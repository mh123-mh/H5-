<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>游戏结束 - 我是环境检察员</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        .gameover-container {
            text-align: center;
            padding: 32px 16px;
            padding-top: calc(40px + env(safe-area-inset-top));
            padding-bottom: calc(40px + env(safe-area-inset-bottom));
            animation: fadeIn 0.5s ease-out;
            min-height: 100vh;
            min-height: 100dvh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            overflow-y: auto;
        }

        .gameover-emoji {
            font-size: clamp(1.8rem, 10vw, 3rem);
            animation: shake 0.5s ease-out;
            margin-bottom: 12px;
            line-height: 1;
        }

        .gameover-title {
            font-size: clamp(1rem, 5vw, 1.5rem);
            color: var(--color-danger);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .gameover-subtitle {
            font-size: 12px;
            color: var(--color-text-muted);
            margin-bottom: 12px;
        }

        .stats-card {
            background: var(--color-bg-card);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 12px;
            margin: 0 auto;
            max-width: 280px;
            width: 100%;
            border: 1px solid var(--color-border);
            animation: slideUp 0.5s ease-out 0.3s both;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid var(--color-border);
            font-size: 12px;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: var(--color-text-muted);
            font-size: 12px;
        }

        .stat-value {
            color: var(--color-danger);
            font-weight: bold;
            font-size: 12px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 16px;
            animation: slideUp 0.5s ease-out 0.5s both;
            width: 100%;
            max-width: 280px;
        }

        .btn {
            padding: 10px 18px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all var(--transition-normal);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex: 1;
            min-width: 80px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--color-secondary) 0%, var(--color-secondary-dark) 100%);
            color: white;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .btn-group {
                flex-direction: column;
                gap: var(--spacing-md);
            }

            .btn {
                width: 100%;
                max-width: 200px;
            }

            .stats-card {
                padding: var(--spacing-md);
                margin: 0 var(--spacing-sm);
            }
        }
    </style>
</head>
<body>
    <div class="gameover-container safe-area-content">
        <div class="gameover-emoji">😢</div>
        <h1 class="gameover-title">游戏结束</h1>
        <p class="gameover-subtitle">污染怪兽突破了防线...</p>

        <div class="stats-card">
            <div class="stat-item">
                <span class="stat-label">坚持波次</span>
                <span class="stat-value" id="waves">3</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">剩余生命</span>
                <span class="stat-value" id="lives">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">获得金币</span>
                <span class="stat-value" id="gold">150</span>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" id="restartBtn">🔄 再试一次</button>
            <button class="btn btn-secondary" id="homeBtn">🏠 返回主页</button>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        function loadStats() {
            const result = localStorage.getItem('battleResult');
            if (result) {
                const data = JSON.parse(result);
                document.getElementById('waves').textContent = data.waves || 0;
                document.getElementById('lives').textContent = data.lives || 0;
                document.getElementById('gold').textContent = data.gold || 0;
            }
        }

        function restartGame(e) {
            if (e) {
                e.stopPropagation();
                e.preventDefault();
            }
            const level = localStorage.getItem('currentLevel') || '1';
            window.location.href = 'game.html?level=' + level;
        }

        function goHome(e) {
            if (e) {
                e.stopPropagation();
                e.preventDefault();
            }
            window.location.href = 'index.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            
            document.getElementById('restartBtn').addEventListener('click', restartGame);
            document.getElementById('restartBtn').addEventListener('touchend', restartGame);
            document.getElementById('homeBtn').addEventListener('click', goHome);
            document.getElementById('homeBtn').addEventListener('touchend', goHome);
        });
    </script>
</body>
</html>
